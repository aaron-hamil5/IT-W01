<!DOCTYPE html>
<html lang="en">
    <head>
        <link href="/css/material_design.css" rel="stylesheet">
        <link href="/css/styles.css" rel="stylesheet">
        <link href="/css/text_style.css" rel="stylesheet">
        <meta charset="UTF-8">
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <meta content="Internet Technology - Week 1 - Introduction to React" name="description">
        <title>React 19 Vanilla Setup</title>

        <!-- Babel to transform JSX in the browser -->
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

        <!-- Import Map maps React 19 ESM modules to CDN routes -->
        <script type="importmap">
            {
              "imports": {
                "react": "https://esm.sh/react@19",
                "react-dom/client": "https://esm.sh/react-dom@19/client"
              }
            }
        </script>
    </head>

    <body class="light">
    <header class="horizontal">
        <a class="bubble horizontal start" href="https://www.uniqstudio.org">
            <img alt="Uniq Studio Logo" src="/img/logo/logo_uniq.webp">
            <p class="font-thin text-title-lg">Uniq</p>
        </a>

        <nav aria-label="Main navigation" class="bubble navigation center">
            <a class="text-primary" href="https://www.uniqstudio.org">Home</a>
            <a href="https://www.uniqstudio.org/page/apps">Apps</a>
            <a href="https://www.uniqstudio.org/page/web">Web</a>
            <a href="https://www.uniqstudio.org/page/photos">Photos</a>
            <a href="https://www.uniqstudio.org/page/contact">Support</a>
        </nav>

        <div class="horizontal">
            <img alt="Theme switcher" aria-label="Toggle theme" class="bubble theme_switcher" role="button"
                 src="/img/ui/auto_mode.webp" tabindex="0">
            <div class="bubble horizontal">
                <p>Hey, User</p>
                <img alt="User avatar" class="user_avatar" src="/img/ui/user_avatar.webp">
            </div>
        </div>
    </header>

    <main>
        <div id="container1" style="background-color: aliceblue"></div>
        <div id="container2" style="background-color: azure"></div>
        <div id="container3" style="background-color: beige"></div>

        <script type="text/babel" data-type="module">
            import React from 'react';
            import { createRoot } from 'react-dom/client';

            function Hello({name}) {
                return ( <h2 className="text-headline-md p-sm">Hello, World from {name}!</h2> );
            }


            function App({name}) {
                return (
                    <div>
                        <h1 className="text-display-lg font-thin p-sm">Welcome to my app</h1>
                        <Hello name={name} />
                    </div>
                );

            }

            const container1 = document.getElementById('container1');
            const root1 = createRoot(container1);
            const container2 = document.getElementById('container2');
            const root2 = createRoot(container2);
            const container3 = document.getElementById('container3');
            const root3 = createRoot(container3);

            root1.render(<App name="container1" />);
            root2.render(<App name="container2" />);
            root3.render(<App name="container3" />);
        </script>
    </main>

    <footer class="footer">
            <hr>
            <div class="horizontal">
                <div aria-label="Uniq Studio logo" class="footer_logo" role="img"></div>
                <div class="header_rotated_logo">
                    <h2 class="text-display-lg font-thin p-0">Uniq Studio</h2>
                    <p class="text-body-lg footer_slogan p-0">We are all unique.</p>
                </div>
                <nav aria-label="Footer navigation" class="link_area">
                    <div>
                        <h3 class="text-title-lg footer_title">Company</h3>
                        <a class="text-body-md footer_link" href="https://www.uniqstudio.org/about-us">About Us</a>
                        <a class="text-body-md footer_link" href="https://www.uniqstudio.org/terms-of-services">Terms of
                            Service</a>
                        <a class="text-body-md footer_link" href="https://www.uniqstudio.org/privacy-policy">Privacy
                            Policy</a>
                    </div>

                    <div>
                        <h3 class="text-title-lg footer_title">Services</h3>
                        <a class="text-body-md footer_link" href="https://www.uniqstudio.org/web-development">Web
                            Development</a>
                        <a class="text-body-md footer_link" href="https://www.uniqstudio.org/mobile-development">Mobile
                            Development</a>
                    </div>

                    <div>
                        <h3 class="text-title-lg footer_title">Socials</h3>
                        <a aria-label="GitHub (opens in a new tab)"
                           class="text-body-md footer_link" href="https://www.github.com/uniq-studio"
                           rel="noopener noreferrer"
                           target="_blank">GitHub</a>
                        <a aria-label="X (opens in a new tab)" class="text-body-md footer_link"
                           href="https://www.x.com/uniqdevuk"
                           rel="noopener noreferrer" target="_blank">X (formerly
                            Twitter)</a>
                        <a aria-label="Instagram (opens in a new tab)" class="text-body-md footer_link"
                           href="https://www.instagram.com/uniqdevuk"
                           rel="noopener noreferrer" target="_blank">Instagram</a>
                    </div>
                </nav>
            </div>
            <hr>
        <p class="text-label-sm font-thin text-center">Copyright &copy; Uniq Studio 2026</p>
        </footer>
    </body>
</html>
